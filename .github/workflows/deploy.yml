name: Pack and Upload to S3

on:
  push:
    branches:
      - main
  workflow_dispatch: # This allows the workflow to be manually triggered

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      - name: Install dependencies
        run: npm install

      - name: Build project
        run: npm run package

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v6
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Upload to S3
        run: |
          # Build files have content hashes in their names, so they never change and can be kept for a year.
          aws s3 cp ./dist/assets s3://champions-rest.com/assets --recursive --cache-control "public,max-age=31536000,immutable"
          # Other files (search index, textures) keep their names between builds, so cache them briefly.
          aws s3 cp ./dist s3://champions-rest.com/ --recursive --exclude "assets/*" --exclude "index.html" --cache-control "public,max-age=300"
          # index.html points at the current build files, so CloudFront and browsers must check it every time.
          aws s3 cp ./dist/index.html s3://champions-rest.com/index.html --cache-control "no-cache" --content-type "text/html; charset=utf-8"
        env:
          S3_BUCKET: champions-rest.com
